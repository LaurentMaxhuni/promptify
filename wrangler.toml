# Repository-level entrypoint for Cloudflare Workers Builds.
# This deploys the API Worker only; the frontend remains on Vercel.
name = "promptify"
main = "backend/src/index.js"
compatibility_date = "2026-08-15"

[vars]
# Content scripts can send requests with the host page's origin. Keep this explicit;
# never replace it with Access-Control-Allow-Origin = "*".
PROMPTIFY_ALLOWED_ORIGINS = "chrome-extension://egbcpmegonokjknlibpddibiocjfoggg,https://chatgpt.com,https://chat.openai.com,https://claude.ai,https://gemini.google.com,https://grok.com,https://*.canva.com,https://www.perplexity.ai,https://poe.com,https://copilot.microsoft.com,https://chat.deepseek.com,https://chat.mistral.ai,https://www.meta.ai,https://meta.ai"
MAX_PROMPT_CHARS = "12000"
MAX_REQUEST_BYTES = "64000"
MAX_RESPONSE_BYTES = "1000000"
UPSTREAM_TIMEOUT_MS = "30000"
PER_CLIENT_DAILY_QUOTA = "30"
GLOBAL_DAILY_QUOTA = "1000"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

[[durable_objects.bindings]]
name = "PROMPTIFY_QUOTA"
class_name = "PromptifyQuota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PromptifyQuota"]

[observability]
enabled = true
head_sampling_rate = 0.1
