<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Promptify</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <main class="wrap" aria-labelledby="app-title">
    <header class="topbar">
      <img src="../logo-icon.png" alt="Promptify" class="logo" />
      <div class="brand-lockup">
        <span id="app-title" class="brand-name">Promptify</span>
        <span class="brand-tagline">Sharper prompts, faster results</span>
      </div>
    </header>

    <div class="pane">
      <section class="prompt-section" aria-labelledby="prompt-heading">
        <div class="section-heading">
          <div>
            <span class="eyebrow">Prompt</span>
            <h1 id="prompt-heading">Start with a rough idea</h1>
          </div>
          <button id="clear-input-button" class="clear-input-button" type="button" hidden>Clear</button>
        </div>

        <div
          id="input"
          class="input-area"
          contenteditable="plaintext-only"
          data-placeholder="Paste your prompt here..."
          role="textbox"
          aria-label="Prompt input"
          aria-describedby="input-hint input-count"
          aria-multiline="true"
          data-empty="true"></div>

        <div class="input-meta">
          <span id="input-hint" class="input-hint">Paste a draft and let Promptify shape it.</span>
          <span id="input-count" class="input-count" aria-live="polite">0 / 12,000</span>
        </div>
      </section>

      <div class="toolbar">
        <div class="select-wrap">
          <select id="framework-select" aria-label="Prompt framework">
            <option value="" selected>No framework</option>
            <option value="CREO">CREO</option>
            <option value="RACE">RACE</option>
            <option value="CARE">CARE</option>
            <option value="APE">APE</option>
            <option value="RISE">RISE</option>
            <option value="TAG">TAG</option>
            <option value="COAST">COAST</option>
            <option value="CREATE">CREATE</option>
          </select>
        </div>
        <button id="history-toggle-button" class="chats-btn" type="button" aria-controls="history-sidebar" aria-expanded="false" aria-label="History" title="History">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
      </div>

      <button class="enhance-btn" id="enhance-button" type="button">
        <svg class="sparkle-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1-8.313-12.454z"/>
          <path d="M17 4a2 2 0 0 0-2 2"/>
          <path d="M19 7a2 2 0 0 0-2-2"/>
          <path d="M19 11v.5"/>
        </svg>
        <span id="enhance-label">Optimize</span>
      </button>

      <div id="status-message" class="status-message" role="status" aria-live="polite" aria-atomic="true" hidden></div>
      <button id="retry-button" class="retry-button" type="button" hidden>Try again</button>

      <section class="output-section" aria-labelledby="output-heading">
        <div class="section-heading output-heading">
          <div>
            <span class="eyebrow">Output</span>
            <h2 id="output-heading">Your refined prompt</h2>
          </div>
          <span id="output-state" class="output-state">Nothing yet</span>
        </div>

        <div class="output-wrap">
          <div id="output" class="output-area" data-placeholder="Your optimized prompt will appear here" role="region" aria-labelledby="output-heading"></div>
          <button id="copy-button" class="copy-btn" type="button" aria-label="Copy output" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
        </div>
      </section>
    </div>

    <div id="history-backdrop" class="history-backdrop" aria-hidden="true" hidden></div>
    <aside id="history-sidebar" class="history-sidebar" role="dialog" aria-modal="true" aria-labelledby="history-title" aria-hidden="true" hidden>
      <div class="history-sidebar-header">
        <h2 id="history-title">History</h2>
        <button id="history-close-button" class="icon-btn" type="button" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <p class="history-sidebar-subtitle">Previously enhanced prompts.</p>
      <div class="history-sidebar-actions">
        <button id="load-history-button" class="secondary-btn" type="button">Load Chats</button>
        <button id="clear-history-button" class="secondary-btn danger-btn" type="button">Clear</button>
      </div>
      <div id="history-list" class="history-list" data-placeholder="No saved chats yet."></div>
    </aside>

    <footer class="footer-bar">
      <span>Promptify</span>
      <span class="footer-hint">Ctrl/Cmd + Enter to optimize</span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>

</html>
