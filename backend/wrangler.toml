name = "promptify"
main = "src/index.js"
compatibility_date = "2026-08-16"

[vars]
PROMPTIFY_ALLOWED_ORIGINS = "chrome-extension://egbcpmegonokjknlibpddibiocjfoggg"
MAX_PROMPT_CHARS = "12000"
MAX_REQUEST_BYTES = "64000"
MAX_RESPONSE_BYTES = "1000000"
UPSTREAM_TIMEOUT_MS = "30000"
PER_CLIENT_DAILY_QUOTA = "30"
GLOBAL_DAILY_QUOTA = "1000"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

[[durable_objects.bindings]]
name = "PROMPTIFY_QUOTA"
class_name = "PromptifyQuota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PromptifyQuota"]

[observability]
enabled = true
head_sampling_rate = 0.1
